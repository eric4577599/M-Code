<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>條碼品質快篩 — 現場檢測</title>
<style>
  :root { --ok:#1f9d55; --warn:#d97706; --fail:#dc2626; --ink:#0f172a; --mut:#94a3b8; --beam:#22d3ee; --hud:#0b1220; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:#334155; display:flex; justify-content:center;
    min-height:100vh; padding:18px 0; }
  /* phone frame (for desktop preview; on a real phone it just fills) */
  .phone { width:390px; max-width:100vw; min-height:800px; background:#fff; border-radius:38px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45); position:relative; border:10px solid #0b0f1a; display:flex; flex-direction:column; }
  .statusbar { background:var(--ink); color:#cbd5e1; font-size:11px; padding:7px 18px; display:flex; justify-content:space-between; }
  .appbar { background:var(--ink); color:#fff; padding:6px 16px 12px; }
  .appbar .t { font-size:15px; font-weight:700; }
  .appbar .s { font-size:11px; color:var(--mut); }

  .view { display:none; flex:1; flex-direction:column; }
  .view.active { display:flex; }

  /* selectors */
  .selrow { display:flex; gap:6px; padding:10px 14px 4px; overflow-x:auto; }
  .selrow .seg { display:flex; border:1px solid #e2e8f0; border-radius:999px; overflow:hidden; flex:0 0 auto; }
  .seg button { border:0; background:#fff; padding:6px 12px; font-size:12px; color:#475569; }
  .seg button.on { background:var(--ink); color:#fff; }
  .profSel { padding:6px 14px; }
  .profSel select { width:100%; font:inherit; padding:9px 10px; border:1px solid #e2e8f0; border-radius:10px; background:#fff; }

  /* HUD */
  .hud { margin:10px 14px; background:var(--hud); border-radius:18px; padding:14px; position:relative; min-height:230px; display:flex; flex-direction:column; }
  .hud .stateTag { position:absolute; top:10px; right:12px; font:700 11px ui-monospace,monospace; padding:3px 9px; border-radius:999px; }
  .stateTag.ARMED{ background:rgba(34,197,94,.2); color:#4ade80 } .stateTag.LOCKED{ background:rgba(239,68,68,.2); color:#f87171 } .stateTag.SCANNING{ background:rgba(148,163,184,.2); color:#cbd5e1 }
  .frame { flex:1; border:2px solid #1e3a5f; border-radius:12px; position:relative; display:flex; align-items:center; justify-content:center; }
  .corner { position:absolute; width:20px; height:20px; border:3px solid var(--beam); }
  .corner.tl{top:-2px;left:-2px;border-right:0;border-bottom:0} .corner.tr{top:-2px;right:-2px;border-left:0;border-bottom:0}
  .corner.bl{bottom:-2px;left:-2px;border-right:0;border-top:0} .corner.br{bottom:-2px;right:-2px;border-left:0;border-top:0}
  .beam { position:absolute; left:8%; right:8%; height:2px; background:linear-gradient(90deg,transparent,var(--beam),transparent); animation:scan 2.4s ease-in-out infinite; }
  @keyframes scan { 0%,100%{top:14%} 50%{top:84%} }
  #symbolMock { width:100%; display:flex; align-items:center; justify-content:center; }
  /* 實機相機畫面(取得授權後填滿觀景窗;mock 條碼在無相機時 fallback) */
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:10px; display:none; }
  .frame.live #cam { display:block; }
  .frame.live #symbolMock { display:none; }
  .bars { width:78%; height:64px; background:#d8c19a; border:3px solid #2a1c0a; border-left-width:6px; border-right-width:6px;
    background-image:repeating-linear-gradient(90deg,#1a120a 0 3px,transparent 3px 6px,#1a120a 6px 8px,transparent 8px 13px); }
  .scaleNote { color:#7dd3fc; font:11px ui-monospace,monospace; margin-top:8px; }
  .camStatus { font:11px ui-monospace,monospace; margin-top:4px; color:#94a3b8; }
  .camStatus.ok { color:#4ade80; } .camStatus.warn { color:#fbbf24; }

  /* lights */
  .lights { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; padding:4px 14px 0; }
  .light { border:1px solid #e2e8f0; border-radius:11px; padding:8px 4px; text-align:center; font-size:11px; }
  .light .dot { width:10px; height:10px; border-radius:50%; display:block; margin:0 auto 4px; }
  .bg-OK{ background:var(--ok) } .bg-WARN{ background:var(--warn) } .bg-FAIL{ background:var(--fail) }
  .gateNote { font-size:11px; color:#64748b; padding:8px 16px 0; }

  /* shutter */
  .shutterWrap { margin-top:auto; padding:14px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .shutter { width:74px; height:74px; border-radius:50%; border:5px solid #cbd5e1; background:#94a3b8; cursor:not-allowed; }
  .shutter.ready { background:var(--ok); border-color:#bbf7d0; box-shadow:0 0 0 4px rgba(34,197,94,.25); cursor:pointer; }
  .shutterLbl { font-size:12px; color:#64748b; }
  .demoPick { padding:4px 14px 12px; }
  .demoPick summary { font-size:12px; color:#0ea5e9; cursor:pointer; }
  .demoPick .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .demoPick .row button { border:1px solid #e2e8f0; background:#fff; border-radius:9px; padding:7px 10px; font-size:12px; }

  /* result */
  .res { padding:16px; display:flex; flex-direction:column; align-items:center; text-align:center; flex:1; overflow-y:auto; }
  .back { align-self:flex-start; background:none; border:0; color:#0ea5e9; font-size:14px; padding:0 0 8px; }
  .decode { font-size:13px; margin-bottom:6px; }
  .circle { width:150px; height:150px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; border:10px solid var(--ok); margin:6px 0; }
  .circle .l { font-size:62px; font-weight:800; line-height:1; } .circle .s { font-size:11px; color:#64748b; }
  .legal { color:var(--fail); font-size:11px; line-height:1.5; margin:4px 10px; }
  .verdict { font-size:15px; font-weight:700; margin:10px 0 4px; padding:7px 16px; border-radius:999px; }
  .verdict.pass { background:#dcfce7; color:#166534; } .verdict.fail { background:#fee2e2; color:#991b1b; }
  .margin { font-size:12px; color:#64748b; }
  .params { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0 4px; }
  .pchip { border:1px solid #e2e8f0; border-radius:8px; padding:5px 9px; font-size:12px; }
  .pchip b { font-weight:800; margin-right:4px; }
  .upsell { margin-top:16px; background:#f0f9ff; border:1px solid #bae6fd; border-radius:12px; padding:12px; font-size:12px; color:#075985; }
  .upsell b { display:block; margin-bottom:4px; }
  .reBtn { margin-top:14px; width:100%; padding:13px; border:0; border-radius:12px; background:var(--ink); color:#fff; font-size:15px; }
  .resultTextWrap { width:100%; margin-top:16px; text-align:left; }
  .resultTextWrap label { font-size:12px; color:#64748b; display:block; margin-bottom:4px; }
  .resultTextWrap textarea { width:100%; font:12px/1.6 ui-monospace,monospace; color:#0f172a; background:#f8fafc;
    border:1px solid #e2e8f0; border-radius:10px; padding:10px; resize:vertical; }
  .saveBtn { margin-top:8px; width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:12px; background:#fff; color:#0f172a; font-size:14px; }

  /* appbar 清單入口 */
  .appbar { display:flex; align-items:center; }
  .appbar .grow { flex:1; }
  .listBadge { background:#0ea5e9; color:#fff; font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; border:0; }
  .listBadge.zero { background:#334155; color:#94a3b8; }

  /* 清單 / 輸出 view */
  .listView { padding:12px 14px; overflow-y:auto; flex:1; }
  .fld { margin-bottom:9px; } .fld label { font-size:11px; color:#64748b; display:block; margin-bottom:3px; }
  .fld input { width:100%; font:inherit; padding:8px 10px; border:1px solid #e2e8f0; border-radius:9px; }
  .scanItem { display:flex; gap:10px; align-items:center; border:1px solid #e2e8f0; border-radius:10px; padding:8px; margin:7px 0; }
  .scanItem .th { width:64px; height:38px; flex:0 0 auto; background:#d8c19a; border:1px solid #e2e8f0; border-radius:5px; overflow:hidden; }
  .scanItem .meta { flex:1; font-size:12px; min-width:0; }
  .scanItem .meta .d { font-family:ui-monospace,monospace; color:#475569; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scanItem .g { font-weight:800; font-size:18px; } .scanItem .v { font-size:11px; }
  .exBtn { width:100%; padding:12px; border:0; border-radius:12px; font-size:15px; font-weight:600; margin-top:8px; }
  .exBtn.pdf { background:#0f172a; color:#fff; } .exBtn.xls { background:#166534; color:#fff; } .exBtn:disabled{ background:#cbd5e1; }
  .exBtn.clear { background:#fff; color:#0f172a; border:1px solid #e2e8f0; }

  /* 列印報告(PDF) */
  #printReport { display:none; }
  .rptHead { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #0f172a; padding-bottom:8px; margin-bottom:12px; }
  .rptHead h1 { font-size:18px; margin:0; }
  .rptMeta { display:grid; grid-template-columns:1fr 1fr; gap:4px 20px; font-size:12px; margin:10px 0 14px; }
  .rptMeta b { display:inline-block; min-width:64px; color:#475569; }
  table.rpt { width:100%; border-collapse:collapse; font-size:11px; }
  table.rpt th, table.rpt td { border:1px solid #cbd5e1; padding:5px 7px; text-align:left; }
  table.rpt th { background:#f1f5f9; }
  .scanPage { page-break-before:always; padding-top:8px; }
  .scanPage .sp-grid { display:grid; grid-template-columns:260px 1fr; gap:16px; align-items:start; }
  .rptLegal { color:#dc2626; font-size:11px; margin-top:6px; }
  @media print {
    body { background:#fff; display:block; padding:0; }
    body > .phone { display:none !important; }
    #printReport { display:block !important; color:#0f172a; }
    @page { margin:14mm; }
  }

  /* 真手機:去掉「手機框中框」,填滿螢幕、隱藏假狀態列 */
  @media (max-width: 500px) {
    body { padding:0; background:#0b1220; }
    .phone { width:100%; max-width:100%; min-height:100vh; border:0; border-radius:0; box-shadow:none; }
    .statusbar { display:none; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>▦ ▦ 100%</span></div>
  <div class="appbar">
    <div class="grow"><div class="t">條碼品質快篩</div><div class="s">相對品質篩檢 · 非 ISO 合規驗證</div></div>
    <button class="listBadge zero" id="listBadge">清單 0</button>
  </div>

  <!-- ════ 拍攝 ════ -->
  <div class="view active" id="v-capture">
    <div class="selrow">
      <div class="seg" id="seg-stage"></div>
      <div class="seg" id="seg-sym"></div>
    </div>
    <div class="profSel"><select id="profile"></select></div>

    <div class="hud">
      <span class="stateTag" id="stateTag">SCANNING</span>
      <div class="frame" id="frame">
        <video id="cam" autoplay muted playsinline></video>
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <div class="beam" id="beam"></div><div id="symbolMock"></div>
      </div>
      <div class="scaleNote">⊞ 比例尺卡 已偵測 · 基準 26.0 mm</div>
      <div class="camStatus" id="camStatus">開啟相機中…</div>
    </div>

    <div class="lights" id="lights"></div>
    <p class="gateNote" id="gateNote"></p>

    <div class="shutterWrap">
      <button class="shutter" id="shutter" disabled></button>
      <span class="shutterLbl" id="shutterLbl">校準中…</span>
    </div>

    <details class="demoPick">
      <summary>示範情境（無相機時用）</summary>
      <div class="row" id="scenarios"></div>
    </details>
  </div>

  <!-- ════ 結果 ════ -->
  <div class="view" id="v-result">
    <div class="res">
      <button class="back" id="back">‹ 重新拍攝</button>
      <div class="decode" id="decode"></div>
      <div class="circle" id="circle"><div class="l" id="letter">–</div><div class="s">參考等級</div></div>
      <div class="legal">相對值・非 ISO 合規證書<br>本工具不出具 ISO 證書，合規驗證請用合規 verifier。</div>
      <div class="verdict" id="verdict"></div>
      <div class="margin" id="margin"></div>
      <div class="params" id="params"></div>
      <div class="resultTextWrap">
        <label>判定後內容（可複製）</label>
        <textarea id="resultText" readonly rows="7"></textarea>
      </div>
      <div class="upsell"><b>升級付費版可解鎖</b>完整參數報告 · 尺寸量測（X寬/BWR/Quiet Zone）· 印刷掉級診斷 · CSV 匯出 · ERP 回寫 · 趨勢監控</div>
      <button class="reBtn" id="reBtn">↻ 再拍一張</button>
    </div>
  </div>

  <!-- ════ 清單 / 輸出 ════ -->
  <div class="view" id="v-list">
    <div class="listView">
      <button class="back" id="listBack">‹ 返回拍攝</button>
      <div class="fld"><label>客戶名稱</label><input type="text" id="f-customer" placeholder="例：ACME 食品"></div>
      <div class="fld"><label>品名</label><input type="text" id="f-product" placeholder="例：早餐脆片 500g 外箱"></div>
      <div class="fld"><label>工單號</label><input type="text" id="f-workorder" placeholder="例：WO-2406A-7741"></div>
      <div class="fld"><label>掃描總數</label><input type="text" id="f-total" readonly></div>
      <div id="listItems"></div>
      <button class="exBtn pdf" id="exportPdfBtn">🖨 輸出 PDF</button>
      <button class="exBtn xls" id="exportXlsBtn">⬇ 輸出 Excel</button>
      <button class="exBtn clear" id="clearListBtn">清除清單</button>
      <p style="font-size:11px;color:#64748b;margin-top:10px">每按一次檢驗即自動存入清單。PDF 首頁為表頭與判定清單，次頁起為每次掃描原圖與判定結果。</p>
    </div>
  </div>
</div>

<!-- 列印報告(輸出 PDF 用),置於 .phone 之外 -->
<div id="printReport"></div>

<script type="module">
import {
  evaluateGate, runDecode, buildGradeResult, evaluateAcceptance,
  SEED_SUBSTRATE_PROFILES, SEED_ACCEPTANCE_POLICIES,
} from "../dist/index.js";

const $ = (id) => document.getElementById(id);
// HTML 跳脫:輸入任意字串,輸出可安全放入 innerHTML 的字串(防使用者輸入弄壞報告版面)
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
// 檔名清理:移除檔案系統不允許的字元,輸出可安全當下載檔名的字串
const safeFileName = (s) => String(s).replace(/[\\/:*?"<>|]/g, "_");
const GC = { A:"#1f9d55", B:"#65a30d", C:"#d97706", D:"#dc2626", F:"#991b1b" };
const SIX = { focus:"對焦", glare:"眩光", washboard:"楞痕透印", whiteBalance:"白平衡", scaleRef:"比例尺卡", picket:"印向直立" };
const STAGES = [["INLINE","產線"],["OUTBOUND","出貨"],["COMPLAINT","客訴"]];

const SYMS = [["ITF14","ITF-14"],["GS1_128","GS1-128"],["QR","QR"],["DATAMATRIX","DM"]];
const is2D = (s) => s === "QR" || s === "DATAMATRIX";
const SAMPLE_DATA = {
  ITF14:"104712345678904", GS1_128:"(01)04712345678901",
  QR:"https://trace.acme/wo/2406A-7741", DATAMATRIX:"DM:LOT2406A-7741/S00231",
};

const state = {
  symbology:"ITF14", profileId:SEED_SUBSTRATE_PROFILES[0].id, processStage:"OUTBOUND",
  decoded:SAMPLE_DATA.ITF14, expected:SAMPLE_DATA.ITF14, canDecode:true,
  gate:{ varLap:210, glare:0.4, wash:0.06, wb:2, picket:3, tilt:2, pxm:9, scaleRef:true },
  grade:{ rLight:0.84, rDark:0.16, edge:0.62, dec:0.25, def:0.18, fpd:0.05, gnu:0.1, uecUsed:2, uecTotal:10 },
};
const profileOf = () => SEED_SUBSTRATE_PROFILES.find(p => p.id === state.profileId);
const policyOf  = () => SEED_ACCEPTANCE_POLICIES.find(p => p.symbology === state.symbology)
  || { id:state.symbology.toLowerCase()+"-default", symbology:state.symbology, requiredGrade:"C", xDimSpecMm:0, quietZoneMinX:0 };

function onSymChange() {
  state.decoded = SAMPLE_DATA[state.symbology];
  state.expected = state.decoded;
  renderHud();
}

// segmented controls
function seg(el, items, key, after) {
  el.innerHTML = items.map(([v,l]) => `<button data-v="${v}" class="${v===state[key]?'on':''}">${l}</button>`).join("");
  el.onclick = (e) => { const b=e.target.closest("button"); if(!b) return; state[key]=b.dataset.v; after && after(); render(); recompute(); };
}
function initSelectors() {
  seg($("seg-stage"), STAGES, "processStage");
  seg($("seg-sym"), SYMS, "symbology", onSymChange);
  $("profile").innerHTML = SEED_SUBSTRATE_PROFILES.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
  $("profile").value = state.profileId;
  $("profile").onchange = () => { state.profileId = $("profile").value; recompute(); };
}
function render() {
  seg($("seg-stage"), STAGES, "processStage");
  seg($("seg-sym"), SYMS, "symbology", onSymChange);
}

// HUD symbol mock: 1D bars or 2D matrix
function renderHud() { $("symbolMock").innerHTML = is2D(state.symbology) ? matrixSvg(state.symbology) : `<div class="bars"></div>`; }
function matrixSvg(type) {
  const N=21, c=8, sz=N*c; let cells="", r=7;
  const finder=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#1a120a"/>`+
    `<rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#d8c19a"/>`+
    `<rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#1a120a"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ r=(r*1103515245+12345)&0x7fffffff;
    const inFinder=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
    if(type==="QR"&&inFinder) continue;
    if((r>>16)%2===0) cells+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#1a120a"/>`;
  }
  let svg=`<svg viewBox="0 0 ${sz} ${sz}" width="160" height="160" style="background:#d8c19a;border:3px solid #2a1c0a">${cells}`;
  if(type==="QR") svg+=finder(0,0)+finder(N-7,0)+finder(0,N-7);
  else { svg+=`<rect x="0" y="0" width="${c}" height="${sz}" fill="#1a120a"/><rect x="0" y="${sz-c}" width="${sz}" height="${c}" fill="#1a120a"/>`;
    for(let i=0;i<N;i+=2) svg+=`<rect x="${i*c}" y="0" width="${c}" height="${c}" fill="#1a120a"/><rect x="${sz-c}" y="${i*c}" width="${c}" height="${c}" fill="#1a120a"/>`; }
  return svg+`</svg>`;
}

// scenarios (no camera)
const GATE_OK = {varLap:200,glare:0.5,wash:0.06,wb:3,picket:3,tilt:2,pxm:9,scaleRef:true};
const SCN = [
  { t:"理想", a:s=>{ Object.assign(s.gate,{varLap:230,glare:0.3,wash:0.05,wb:2,picket:2,tilt:2,pxm:10,scaleRef:true}); Object.assign(s.grade,{rLight:0.87,rDark:0.12,edge:0.74,dec:0.12,def:0.1,fpd:0.03,gnu:0.06,uecUsed:1,uecTotal:10}); s.canDecode=true; } },
  { t:"楞痕偏高", a:s=>{ Object.assign(s.gate,{varLap:195,glare:0.6,wash:0.13,wb:3,picket:4,tilt:3,pxm:9,scaleRef:true}); Object.assign(s.grade,{rLight:0.8,rDark:0.2,edge:0.42,dec:0.4,def:0.3,fpd:0.12,gnu:0.28,uecUsed:4,uecTotal:10}); s.canDecode=true; } },
  { t:"低對比", a:s=>{ Object.assign(s.gate,GATE_OK); Object.assign(s.grade,{rLight:0.52,rDark:0.34,edge:0.3,dec:0.4,def:0.3,fpd:0.08,gnu:0.15,uecUsed:3,uecTotal:10}); s.canDecode=true; } },
  { t:"套印不準(2D)", a:s=>{ s.symbology="QR"; Object.assign(s.gate,GATE_OK); Object.assign(s.grade,{rLight:0.82,rDark:0.18,edge:0.55,fpd:0.12,gnu:0.5,uecUsed:7,uecTotal:10}); s.canDecode=true; } },
  { t:"失焦", a:s=>{ s.gate.varLap=60; } },
  { t:"眩光", a:s=>{ s.gate.glare=6; } },
  { t:"不可讀", a:s=>{ Object.assign(s.gate,GATE_OK); s.canDecode=false; } },
];
$("scenarios").innerHTML = SCN.map((s,i)=>`<button data-i="${i}">${s.t}</button>`).join("");
$("scenarios").onclick = (e) => { const b=e.target.closest("button"); if(!b) return; SCN[+b.dataset.i].a(state); $("profile").value=state.profileId; onSymChange(); render(); recompute(); };

// gate
function evalGate() {
  return evaluateGate({ symbolDetected:true, varLap:state.gate.varLap, glareRatio:state.gate.glare/100,
    washboardAmpRatio:state.gate.wash, wbGainDeviation:state.gate.wb/100, scaleRefDetected:state.gate.scaleRef,
    picketAngleDeg:state.gate.picket, perspectiveTiltDeg:state.gate.tilt, gsdMmPerPx:0.12, pxPerModule:state.gate.pxm });
}
function recompute() {
  const gate = evalGate();
  $("stateTag").textContent = gate.state; $("stateTag").className = "stateTag " + gate.state;
  $("lights").innerHTML = gate.report.checks.filter(c => SIX[c.key]).map(c =>
    `<div class="light"><span class="dot bg-${c.status}"></span>${SIX[c.key]}<br><small style="color:#94a3b8">${c.status}</small></div>`).join("");
  const armed = gate.state === "ARMED", sh = $("shutter");
  $("beam").style.display = armed ? "none" : "block"; // 鎖定後停止掃描光束（已對準）
  sh.className = "shutter " + (armed?"ready":""); sh.disabled = !armed;
  $("shutterLbl").textContent = armed ? "可拍 — 點按檢驗" : (gate.state==="LOCKED" ? "快門鎖死（有未過項）" : "校準中…");
  $("gateNote").textContent = armed ? "WARN（黃）仍可拍，數值會標註受楞痕影響。" : "六項全綠前快門鎖死，確保每次拍攝一致。";
}

// inspect (free tier: decode + relative grade + basic params; no measurement/diagnosis/csv)
function inspect() {
  const gate = evalGate(); if (gate.state !== "ARMED") return;
  const sym = state.symbology, g = state.grade;
  const dim = sym==="QR" ? "v3 (29×29)" : sym==="DATAMATRIX" ? "16×16" : undefined;
  const decoder = { decode:() => state.canDecode ? { symbology:sym, data:state.decoded, dimension:dim } : null };
  const decode = runDecode(decoder, { declaredSymbology:sym, handle:{} }, { expectedGtin:state.expected });
  const photometric = { rLight:g.rLight, rDark:g.rDark, rDarkMin:g.rDark, edgeContrasts:[g.edge] };
  // 1D: N scanlines averaged. 2D: single param set, min-takes-overall (per core lib C7.3).
  const grade = is2D(sym)
    ? buildGradeResult(sym, { photometric, geometric:{ finderTimingDamageRatio:g.fpd, gridDeviation:g.gnu, usedEC:g.uecUsed, totalEC:g.uecTotal } })
    : buildGradeResult(sym, Array.from({length:10}, () => ({ photometric, geometric:{ maxWidthDeviation:g.dec, tolerance:1, maxElementReflectanceNonUniformity:g.def } })));
  const acceptance = evaluateAcceptance(grade, policyOf());

  $("decode").innerHTML = decode.decoded
    ? `<span style="color:var(--ok)">✓ 解碼成功</span> · ${esc(decode.data)}${decode.dimension?" · "+esc(decode.dimension):""}`
    : `<span style="color:var(--fail)">✗ 不可讀（綜合崩壞）</span>`;
  $("letter").textContent = grade.overall;
  $("circle").style.borderColor = GC[grade.overall]; $("letter").style.color = GC[grade.overall];
  const v = $("verdict");
  v.className = "verdict " + (acceptance.pass?"pass":"fail");
  v.textContent = (acceptance.pass ? "通過" : "未通過") + ` ｜ 門檻 ≥ ${policyOf().requiredGrade}`;
  $("margin").textContent = "margin " + acceptance.marginScore.toFixed(2);
  $("params").innerHTML = grade.parameters.map(p =>
    `<span class="pchip"><b style="color:${GC[p.letter]}">${p.letter}</b>${p.code}</span>`).join("");
  const symLabelR = (SYMS.find(([v])=>v===sym)||[,sym])[1];
  $("resultText").value = [
    `製程環節：${stageLabelOf(state.processStage)}`,
    `符號別：${symLabelR}`,
    `解碼：${decode.decoded ? "成功 · "+decode.data : "不可讀（綜合崩壞）"}`,
    `參考等級：${grade.overall}（相對值，非 ISO 合規證書）`,
    `判定：${acceptance.pass?"通過":"未通過"}（門檻 ≥ ${policyOf().requiredGrade}，margin ${acceptance.marginScore.toFixed(2)}）`,
    `分級參數：${grade.parameters.map(p=>`${p.code} ${p.letter}(${p.score.toFixed(2)})`).join(" / ")}`,
  ].join("\n");
  saveScan(decode, grade, acceptance);
  show("result");
}

// ─── 掃描清單 / 輸出 ───
const scans = [];
const fmtTime = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
function snapMatrix(type) {
  const N=21, c=9, sz=N*c; let cells="", r=7;
  const finder=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#1a120a"/>`+
    `<rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#d8c19a"/>`+
    `<rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#1a120a"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ r=(r*1103515245+12345)&0x7fffffff;
    const inFinder=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
    if(type==="QR"&&inFinder) continue;
    if((r>>16)%2===0) cells+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#1a120a"/>`;
  }
  let inner=cells;
  if(type==="QR") inner+=finder(0,0)+finder(N-7,0)+finder(0,N-7);
  else { inner+=`<rect x="0" y="0" width="${c}" height="${sz}" fill="#1a120a"/><rect x="0" y="${sz-c}" width="${sz}" height="${c}" fill="#1a120a"/>`;
    for(let i=0;i<N;i+=2) inner+=`<rect x="${i*c}" y="0" width="${c}" height="${c}" fill="#1a120a"/><rect x="${sz-c}" y="${i*c}" width="${c}" height="${c}" fill="#1a120a"/>`; }
  return `<svg viewBox="0 0 ${sz} ${sz}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background:#d8c19a">${inner}</svg>`;
}
function snapBarcode(dataText) {
  const W=320, H=110; let seed=0; for(const ch of String(dataText)) seed=(seed*31+ch.charCodeAt(0))&0x7fffffff;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return ((seed>>16)&0x7fff)/0x7fff; };
  const top=10, bh=H-42; let x=16, bars="";
  while(x<W-16){ const w=2+Math.floor(rnd()*3); if(rnd()>0.4) bars+=`<rect x="${x}" y="${top}" width="${w}" height="${bh}" fill="#1a120a"/>`; x+=w+(rnd()>0.6?1:0); }
  const bearer=`<rect x="8" y="4" width="${W-16}" height="3" fill="#1a120a"/><rect x="8" y="${top+bh+2}" width="${W-16}" height="3" fill="#1a120a"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="background:#d8c19a">${bearer}${bars}<text x="${W/2}" y="${H-10}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#1a120a">1 04712 345678 9</text></svg>`;
}
const symbolSnapshot = (sym) => is2D(sym) ? snapMatrix(sym) : snapBarcode(SAMPLE_DATA[sym]);
const stageLabelOf = (v) => (STAGES.find(([k])=>k===v)||[,v])[1];

// ── 相機:進入網頁自動開啟後鏡頭;無相機/未授權則保留 mock 條碼 ──
let camVideo = null;
function setCamStatus(txt, cls) { const el=$("camStatus"); if(el){ el.textContent=txt; el.className="camStatus "+(cls||""); } }
async function initCamera(userGesture) {
  if (camVideo) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setCamStatus("此瀏覽器不支援相機，顯示示意條碼", "warn"); return; }
  if (!window.isSecureContext) { setCamStatus("需 HTTPS 才能開相機", "warn"); return; }
  try {
    setCamStatus("開啟相機中…", "");
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" } }, audio:false });
    const v = $("cam"); v.srcObject = stream; await v.play().catch(()=>{});
    $("frame").classList.add("live"); camVideo = v;
    const label = (stream.getVideoTracks()[0] || {}).label || "";
    setCamStatus("● 相機已開啟" + (label?("："+label):"（後鏡頭）"), "ok");
  } catch (e) {
    const map = { NotAllowedError:"相機權限被拒 — 請到 iPhone 設定→Safari→相機 允許，或點網址列 ⒜A→網站設定",
      NotFoundError:"找不到相機", NotReadableError:"相機被其他 App 佔用（關掉相機/其他相機頁）",
      SecurityError:"安全性限制（需 HTTPS）", OverconstrainedError:"無符合的後鏡頭", AbortError:"開啟中斷" };
    setCamStatus((map[e.name] || ("相機開啟失敗："+e.name)) + (userGesture?"":" ·點畫面重試"), "warn");
  }
}
// 擷取當下畫面作為「掃描原圖」:有相機取實拍 jpeg,否則用 SVG 快照
function captureImage() {
  const v = camVideo;
  if (v && v.videoWidth) {
    try {
      const w=320, h=Math.round(320 * v.videoHeight / v.videoWidth);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(v,0,0,w,h);
      return { type:"img", data:c.toDataURL("image/jpeg",0.7) };
    } catch (e) {}
  }
  return { type:"svg", data:symbolSnapshot(state.symbology) };
}
const imgMarkup = (img, fit="cover") => img.type==="img"
  ? `<img src="${img.data}" style="width:100%;height:100%;object-fit:${fit};display:block">` : img.data;

function saveScan(decode, grade, acceptance) {
  scans.push({
    n: scans.length+1, ts: new Date(), symbology: state.symbology,
    symLabel: (SYMS.find(([v])=>v===state.symbology)||[,state.symbology])[1],
    data: decode.decoded ? decode.data : "(不可讀)", decoded: decode.decoded,
    grade: grade.overall, pass: acceptance.pass, reqGrade: policyOf().requiredGrade,
    margin: acceptance.marginScore, img: captureImage(),
    params: grade.parameters.map(p=>({ letter:p.letter, code:p.code, label:p.label, score:p.score })),
    profileName: (profileOf()||{}).name || "",
    stage: state.processStage, stageLabel: stageLabelOf(state.processStage),
  });
  updateBadge(); renderList();
}
function updateBadge() { const b=$("listBadge"); b.textContent=`清單 ${scans.length}`; b.classList.toggle("zero", scans.length===0); }
function renderList() {
  $("f-total").value = String(scans.length);
  $("listItems").innerHTML = scans.length
    ? scans.map(s=>`<div class="scanItem"><div class="th">${imgMarkup(s.img)}</div>
        <div class="meta">#${s.n} · ${fmtTime(s.ts)} · <b>${s.stageLabel}</b> · ${s.symLabel}<div class="d">${esc(s.data)}</div></div>
        <div style="text-align:center"><div class="g" style="color:${GC[s.grade]}">${s.grade}</div>
          <div class="v" style="color:${s.pass?'#166534':'#991b1b'}">${s.pass?'通過':'未通過'}</div></div></div>`).join("")
    : `<p style="font-size:12px;color:#94a3b8">尚無掃描紀錄，回拍攝按檢驗即累積。</p>`;
  const has = scans.length>0;
  $("exportPdfBtn").disabled=!has; $("exportXlsBtn").disabled=!has;
}
// 輸出用表頭欄位:讀取三個輸入框,回傳「已 HTML 跳脫」的值(只供 innerHTML / XLS-HTML 場景)
function metaFields() { return { customer:esc($("f-customer").value.trim()||"—"), product:esc($("f-product").value.trim()||"—"), wo:esc($("f-workorder").value.trim()||"—") }; }
function exportPdf() {
  if (!scans.length) return;
  const m = metaFields(), dateStr = new Date().toLocaleString("zh-TW"), passN = scans.filter(s=>s.pass).length;
  const summary = scans.map(s=>`<tr><td>${s.n}</td><td>${fmtTime(s.ts)}</td><td>${s.stageLabel}</td><td>${s.symLabel}</td><td>${esc(s.data)}</td><td>${s.grade}</td><td>${s.pass?"通過":"未通過"}</td></tr>`).join("");
  const page1 = `<div class="rptHead"><h1>條碼品質快篩報告</h1><div style="text-align:right;font-size:12px;color:#475569">相對品質篩檢<br>${dateStr}</div></div>
    <div class="rptMeta"><div><b>客戶名稱</b>${m.customer}</div><div><b>品名</b>${m.product}</div>
      <div><b>工單號</b>${m.wo}</div><div><b>掃描總數</b>${scans.length} 筆</div>
      <div><b>判定通過</b>${passN} / ${scans.length}</div><div><b>報告時間</b>${dateStr}</div></div>
    <table class="rpt"><tr><th>#</th><th>時間</th><th>製程環節</th><th>符號別</th><th>解碼字串</th><th>參考等級</th><th>判定</th></tr>${summary}</table>
    <p class="rptLegal">※ 本報告為相對品質篩檢參考值，非 ISO 合規證書；合規驗證請使用具固定照明幾何之合規 verifier。</p>`;
  const details = scans.map(s=>`<div class="scanPage"><h2 style="font-size:15px;margin:0 0 12px">掃描 #${s.n} · ${fmtTime(s.ts)} · ${s.stageLabel} · ${s.symLabel}</h2>
    <div class="sp-grid"><div><div style="width:100%;height:170px;background:#d8c19a;border:1px solid #94a3b8;border-radius:6px;overflow:hidden">${imgMarkup(s.img,"contain")}</div><p style="text-align:center;color:#64748b;font-size:12px;margin-top:4px">掃描原圖</p></div>
    <div><p style="margin:0 0 8px"><b>參考等級：</b><span style="color:${GC[s.grade]};font-weight:800;font-size:20px">${s.grade}</span>
      　<b>判定：</b>${s.pass?"通過":"未通過"}（門檻 ≥ ${s.reqGrade}，margin ${s.margin.toFixed(2)}）</p>
      <p style="margin:0 0 8px"><b>解碼：</b>${s.decoded?"成功":"不可讀"} · ${esc(s.data)}</p>
      <table class="rpt"><tr><th>級</th><th>參數</th><th>分數</th></tr>
        ${s.params.map(p=>`<tr><td>${p.letter}</td><td>${p.label} (${p.code})</td><td>${p.score.toFixed(2)}</td></tr>`).join("")}</table></div></div></div>`).join("");
  $("printReport").innerHTML = page1 + details;
  window.print();
}
function exportXls() {
  if (!scans.length) return;
  const m = metaFields(), dateStr = new Date().toLocaleString("zh-TW");
  const head = `<tr><td>客戶名稱</td><td>${m.customer}</td><td>品名</td><td>${m.product}</td></tr>
    <tr><td>工單號</td><td>${m.wo}</td><td>掃描總數</td><td>${scans.length}</td></tr>
    <tr><td>報告時間</td><td>${dateStr}</td><td></td><td></td></tr><tr><td></td></tr>`;
  const cols = `<tr><th>#</th><th>時間</th><th>製程環節</th><th>符號別</th><th>解碼字串</th><th>參考等級</th><th>判定</th><th>門檻</th><th>margin</th><th>工法/楞型</th></tr>`;
  const body = scans.map(s=>`<tr><td>${s.n}</td><td>${fmtTime(s.ts)}</td><td>${s.stageLabel}</td><td>${s.symLabel}</td><td>${esc(s.data)}</td><td>${s.grade}</td><td>${s.pass?"通過":"未通過"}</td><td>${s.reqGrade}</td><td>${s.margin.toFixed(2)}</td><td>${esc(s.profileName)}</td></tr>`).join("");
  const html = `<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body><table border="1">${head}${cols}${body}</table></body></html>`;
  const blob = new Blob(["﻿"+html], { type:"application/vnd.ms-excel" });
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`檢驗報告_${safeFileName($("f-workorder").value.trim())||"export"}.xls`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000); // 下載觸發後釋放物件 URL
}
function clearList() { if(!scans.length) return; scans.length=0; updateBadge(); renderList(); }

// view switch
function show(v) { document.querySelectorAll(".view").forEach(x=>x.classList.remove("active")); $("v-"+v).classList.add("active"); }
$("shutter").onclick = inspect;
$("back").onclick = () => show("capture");
$("reBtn").onclick = () => show("capture");
$("listBadge").onclick = () => { renderList(); show("list"); };
$("listBack").onclick = () => show("capture");
$("exportPdfBtn").onclick = exportPdf;
$("exportXlsBtn").onclick = exportXls;
$("clearListBtn").onclick = clearList;

// init
initSelectors(); renderHud(); recompute(); updateBadge(); renderList();
// 進入網頁自動開啟相機;iOS 若要求手勢,點畫面時再補試(直到成功)
initCamera(false);
document.addEventListener("click", () => { if (!camVideo) initCamera(true); });
</script>
